sweep:
  seeds: [42, 123, 456]
  grid:
    # Refine around the tau=0.05 optimum found in part 1. Excludes combos already
    # run: tau=0.05 (done, both lr) and tau=0.01 (done). Drops tau=0.25 / default
    # 0.35 -- far too high for cosine-similarity logits in [-1, 1] (loss stuck near
    # ln(vocab), pure underfit). lr fixed at 3e-3: it had negligible effect in part 1
    # (tau=0.05: 0.0114 @2e-3 vs 0.0115 @3e-3).
    tau.json_args.initial_tau: [0.03, 0.04, 0.045, 0.06]
    optimizer.json_args.lr: [3.0e-3]

graph:
  n_layers: 4
  d_model: 256
  n_heads: 4
  dropout: 0.0
  log_q_correction: 1.0
  is_cosine_similarity: true

data:
  vocab_size: 156922
  max_seq_len: 100
  bos: 0
  max_train_events_per_user: 100
  dataset:
    class_name: AmazonBeautyDataset
    json_args:
      path_interactions: data/amazon_beauty/interactions.jsonl
      core_min_interaction_per_item: 5
      test_interval_seconds: 1209600  # 14 days
      window_start: 1609459200000   # 2021-01-01 (ms)
      window_end: 1672531200000     # 2023-01-01 (ms)

tau:
  class_name: ConstantTau
  json_args:
    initial_tau: 0.04
    tau_min: null
    tau_max: null
    num_epochs: null
    num_tokens_per_epoch: null

training_dataset:
  batch_size: 128
  device: cuda
  chunk_rows: 64000
  shuffle: true
  seed: 42
  uniform_negative_items: 24000
  in_batch_negative_items: 6000

test_dataset:
  batch_size: 32
  device: cuda

optimizer:
  class_name: AdamW
  json_args:
    lr: 3.0e-3
    weight_decay: 1.0e-5

scheduler:
  class_name: CosineAnnealingLR
  json_args:
    T_max: 30
    eta_min: 1.0e-3

training:
  num_epochs: 30
  grad_clip: 1.0
  eval_every: 1
  logging: true
  log_dir: mlruns
  console_logging: true
  seed: 42

evaluator:
  topk: 100
