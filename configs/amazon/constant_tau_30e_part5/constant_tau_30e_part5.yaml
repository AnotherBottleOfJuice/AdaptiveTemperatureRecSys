# Re-run of the top constant taus (0.06 / 0.065 / 0.07) under the new negatives
# setting (20000 uniform / 10000 in-batch = 30k), lr fixed at 2e-3.
sweep:
  seeds: [42, 123, 456]
  grid:
    tau.json_args.initial_tau: [0.06, 0.065, 0.07]
    optimizer.json_args.lr: [2.0e-3]

graph:
  n_layers: 4
  d_model: 256
  n_heads: 4
  dropout: 0.0
  log_q_correction: 1.0
  is_cosine_similarity: true

data:
  vocab_size: 156922
  max_seq_len: 100
  bos: 0
  max_train_events_per_user: 100
  dataset:
    class_name: AmazonBeautyDataset
    json_args:
      path_interactions: data/amazon_beauty/interactions.jsonl
      core_min_interaction_per_item: 5
      test_interval_seconds: 1209600  # 14 days
      window_start: 1609459200000   # 2021-01-01 (ms)
      window_end: 1672531200000     # 2023-01-01 (ms)

tau:
  class_name: ConstantTau
  json_args:
    initial_tau: 0.065
    tau_min: null
    tau_max: null
    num_epochs: null
    num_tokens_per_epoch: null

training_dataset:
  batch_size: 128
  device: cuda
  chunk_rows: 64000
  shuffle: true
  seed: 42
  uniform_negative_items: 20000
  in_batch_negative_items: 10000

test_dataset:
  batch_size: 32
  device: cuda

optimizer:
  class_name: AdamW
  json_args:
    lr: 2.0e-3
    weight_decay: 1.0e-5

scheduler:
  class_name: CosineAnnealingLR
  json_args:
    T_max: 40
    eta_min: 1.0e-3

training:
  num_epochs: 40
  grad_clip: 1.0
  eval_every: 1
  logging: true
  log_dir: mlruns
  console_logging: true
  seed: 42

evaluator:
  topk: 100
