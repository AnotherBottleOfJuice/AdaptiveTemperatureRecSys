sweep:
  seeds: [42, 123, 456]
  grid:
    optimizer.json_args.lr: [2.0e-3, 3.0e-3]
    tau.json_args.tau_min: [0.035, 0.040]
    tau.json_args.tau_max: [0.055, 0.060]

graph:
  n_layers: 4
  d_model: 256
  n_heads: 4
  dropout: 0.0
  log_q_correction: 1.0
  is_cosine_similarity: true

data:
  vocab_size: 157162
  max_seq_len: 100
  bos: 0
  path_interactions: data/interactions.parquet
  path_embeddings: data/embeddings.parquet
  path_artists: data/artists.parquet
  core_min_interaction_per_user: 5
  test_interval_seconds: 604800  # 7 days
  max_train_events_per_user: 100

tau:
  class_name: LinearTau
  json_args:
    initial_tau: null
    tau_min: 0.03
    tau_max: 0.06
    num_epochs: 30
    num_tokens_per_epoch: 4019032

training_dataset:
  batch_size: 128
  device: cuda
  chunk_rows: 64000
  shuffle: true
  seed: 42
  pin_memory: true
  uniform_negative_items: 24000
  in_batch_negative_items: 6000

test_dataset:
  batch_size: 32
  device: cuda

optimizer:
  class_name: AdamW
  json_args:
    lr: 2.0e-3
    weight_decay: 1.0e-5

scheduler:
  class_name: CosineAnnealingLR
  json_args:
    T_max: 30
    eta_min: 1.0e-3

training:
  num_epochs: 30
  grad_clip: 1.0
  eval_every: 1
  logging: true
  log_dir: mlruns
  console_logging: true
  seed: 42

evaluator:
  topk: 100
