# Shifted cosine per-user temperature.
#
# tau peaks (tau_max, smooth) where shift+logit == 0  -> logit == |shift|
# tau bottoms (tau_min, sharp)  where shift+logit == -scale -> logit == |shift| - scale
# tau peaks again at logit <= |shift| - 2*scale
#
# Grounded in train logit stats from mlruns/mlflow.db (CosPerUser runs, cosine sim in [-1, 1]):
#   pos_logit_mean ~ 0.26 (range 0.13..0.33)
#   neg_logit_mean ~ 0.00 (range -0.08..0.06)
# With shift=-0.5, scale=0.25: sharpest tau lands at logit ~0.25 (typical positive),
# smooth tau at logit ~0.0 (typical negative) and at very confident logits >= 0.5.
# tau_min/tau_max range reuses the best-performing CosPerUser sweep (min=0.04, max=0.065).
#
# Sweep: shift kept tight around -0.4; scale kept tight around 0.3. The sharp point
# (logit = |shift| - scale) stays near the positive band: with shift=-0.4,
# scale 0.25 -> tau_min at logit~0.15, scale 0.3 -> ~0.1, scale 0.35 -> ~0.05.
sweep:
  seeds: [42, 123, 456]
  grid:
    optimizer.json_args.lr: [3.0e-3]
    tau.json_args.shift: [-0.45, -0.4, -0.35]
    tau.json_args.scale: [0.25, 0.3, 0.35]
    tau.json_args.tau_max: [0.06, 0.065]

graph:
  n_layers: 4
  d_model: 256
  n_heads: 4
  dropout: 0.0
  log_q_correction: 1.0
  is_cosine_similarity: true

data:
  vocab_size: 157162
  max_seq_len: 100
  bos: 0
  path_interactions: data/interactions.parquet
  path_embeddings: data/embeddings.parquet
  path_artists: data/artists.parquet
  core_min_interaction_per_user: 5
  test_interval_seconds: 604800  # 7 days
  max_train_events_per_user: 100

tau:
  class_name: ShiftedCosPerUserTau
  json_args:
    initial_tau: 0.45
    tau_min: 0.04
    tau_max: 0.065
    num_epochs: 30
    num_tokens_per_epoch: 4019032
    shift: -0.4
    scale: 0.3

training_dataset:
  batch_size: 128
  device: cuda
  chunk_rows: 64000
  shuffle: true
  seed: 42
  uniform_negative_items: 22000
  in_batch_negative_items: 8000

test_dataset:
  batch_size: 32
  device: cuda

optimizer:
  class_name: AdamW
  json_args:
    lr: 3.0e-3
    weight_decay: 1.0e-5

scheduler:
  class_name: null
  json_args: {}

training:
  num_epochs: 30
  grad_clip: 1.0
  eval_every: 1
  logging: true
  log_dir: mlruns
  console_logging: true
  seed: 42

evaluator:
  topk: 100
