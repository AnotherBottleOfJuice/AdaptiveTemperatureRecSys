sweep:
  seeds: [42, 123, 456]
  grid:
    optimizer.json_args.lr: [3.0e-3]
    tau.json_args.base_threshold: [0.2, 0.215, 0.23]
    tau.json_args.linear_coeff: [-0.1, -0.15, -0.2]

graph:
  n_layers: 4
  d_model: 256
  n_heads: 4
  dropout: 0.0
  log_q_correction: 1.0
  is_cosine_similarity: true

data:
  vocab_size: 157162
  max_seq_len: 100
  bos: 0
  max_train_events_per_user: 100
  dataset:
    class_name: YambdaDataset
    json_args:
      path_interactions: data/interactions.parquet
      path_embeddings: data/embeddings.parquet
      path_artists: data/artists.parquet
      core_min_interaction_per_item: 5
      test_interval_seconds: 604800  # 7 days

tau:
  class_name: MACLossTau
  json_args:
    initial_tau: 0.0525
    tau_min: 0.04
    tau_max: 0.065
    num_epochs: 30
    num_tokens_per_epoch: 4019032
    base_threshold: 0.215
    linear_coeff: -0.15

training_dataset:
  batch_size: 128
  device: cuda
  chunk_rows: 64000
  shuffle: true
  seed: 42
  uniform_negative_items: 22000
  in_batch_negative_items: 8000

test_dataset:
  batch_size: 32
  device: cuda

optimizer:
  class_name: AdamW
  json_args:
    lr: 3.0e-3
    weight_decay: 1.0e-5

scheduler:
  class_name: null
  json_args: {}

training:
  num_epochs: 30
  grad_clip: 1.0
  eval_every: 1
  logging: true
  log_dir: mlruns
  console_logging: true
  seed: 42

evaluator:
  topk: 100
